name = offhand_screen_view
title = Offhand Screen View (Minecraft-style)
description = Shows the item held in the offhand slot as an on-screen icon. With the bundled client-side companion mod it is only visible in first person and hides automatically in 2nd/3rd person. Blocks are drawn as 3D cubes (the same renderer the engine uses for the hotbar), tools use their wield_image, so the icon looks like the item you hold instead of a flat inventory picture. Works with the "offhand" mod (or MCL2's mcl_offhand) and falls back to the "offhand" inventory list when neither is present.
optional_depends = offhand, mcl_offhand

load_mod_offhand_screen_view = true