name = offhand_screen_view
title = Offhand Screen View (Minecraft-style)
description = Shows the item held in the offhand slot as an on-screen icon, visible in BOTH first-person and third-person view. Blocks are drawn as 3D cubes (the same renderer the engine uses for the hotbar), tools use their wield_image, so the icon looks like the item you hold instead of a flat inventory picture. Companion add-on for the "offhand" mod.
depends = offhand